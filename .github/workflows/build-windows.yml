name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'codex_switch_win.py'
      - 'CodexSwitch.spec'
      - 'assets/moonbridge.exe'
      - 'assets/icon.ico'
      - 'assets/icon.png'
      - 'installer/CodexSwitch.iss'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyinstaller pillow pystray

      - name: Build EXE with PyInstaller
        run: |
          dir
          pyinstaller --clean --noconfirm "${{ github.workspace }}\CodexSwitch.spec"

      - name: Verify EXE
        run: |
          dir dist\
          Write-Host "EXE size: $([math]::Round((Get-Item dist\CodexSwitch.exe).length / 1MB, 1)) MB"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          mkdir installer\installer_output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CodexSwitch.iss
          dir installer\installer_output\

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexSwitch-Setup
          path: installer\installer_output\CodexSwitch-Setup.exe
          retention-days: 30
