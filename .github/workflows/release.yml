name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:          # 支持在 GitHub 页面手动触发

jobs:
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pillow pystray

      - name: Build exe
        run: pyinstaller --clean --noconfirm CodexSwitch.spec

      - name: Rename artifact
        run: mv dist/CodexSwitch.exe dist/CodexSwitch-Setup.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CodexSwitch ${{ github.ref_name }}
          body: |
            ## CodexSwitch ${{ github.ref_name }} — Windows

            **下载 `CodexSwitch-Setup.exe`，双击直接运行，无需安装。**

            系统托盘图标 → 右键设置 → 填入 DeepSeek API Key → 开启开关。
          files: dist/CodexSwitch-Setup.exe
          draft: false
          prerelease: false
