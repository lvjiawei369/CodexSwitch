name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Windows .exe 通过 CI 自动构建
# macOS DMG 本地 bash build_swift.sh / build_swift_window.sh 打包后用 gh release upload 上传

jobs:
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pillow pystray

      - name: Build
        run: pyinstaller --clean --noconfirm CodexSwitch.spec

      - name: Rename
        run: mv dist/CodexSwitch.exe dist/CodexSwitch-Setup.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodexSwitch-Setup.exe
            assets/moonbridge.exe
